name: Build War Mode APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Build Android Debug APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        cd android-app
        gradle assembleDebug --stacktrace
        cp app/build/outputs/apk/debug/app-debug.apk ../WarMode.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: war-mode-app
        path: WarMode.apk

    - name: Create Direct APK Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "War Mode v1.0.0 (Direct APK)"
        body: "Direct .apk download for your Android phone. No zip extraction needed."
        files: WarMode.apk
